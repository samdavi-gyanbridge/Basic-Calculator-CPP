<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="#0d1117"/>

  <!-- Terminal Window -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="720" height="560" rx="10" fill="url(#bg)" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="720" height="38" rx="10" fill="#181825"/>
    <path d="M0 28 h720 v10 h-720 z" fill="#181825"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="19" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="19" r="6" fill="#a6e3a1"/>
    
    <!-- Title -->
    <text x="360" y="24" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">terminal — ./calculator (bash)</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 65)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" line-height="1.5">
      <!-- Command Run -->
      <text x="0" y="0" fill="#89b4fa" font-weight="bold">$ ./calculator</text>

      <!-- Welcome Banner -->
      <text x="0" y="24" fill="#cdd6f4">========================================================</text>
      <text x="0" y="44" fill="#89dceb" font-weight="bold">               BASIC CALCULATOR (C++)                   </text>
      <text x="0" y="64" fill="#cdd6f4">========================================================</text>
      <text x="0" y="84" fill="#a6adc8">Welcome to the beginner-friendly C++ console calculator!</text>
      <text x="0" y="104" fill="#a6adc8">Perform addition, subtraction, multiplication, and division.</text>

      <!-- Menu -->
      <text x="0" y="134" fill="#cdd6f4">----------------- OPERATIONS MENU ----------------------</text>
      <text x="0" y="154" fill="#f9e2af">  1. Addition       (+)</text>
      <text x="0" y="174" fill="#f9e2af">  2. Subtraction    (-)</text>
      <text x="0" y="194" fill="#f9e2af">  3. Multiplication (*)</text>
      <text x="0" y="214" fill="#f9e2af">  4. Division       (/)</text>
      <text x="0" y="234" fill="#cdd6f4">--------------------------------------------------------</text>

      <!-- Prompts & Interaction -->
      <text x="0" y="260" fill="#cdd6f4">Enter your choice (1-4 or +, -, *, /): <tspan fill="#a6e3a1" font-weight="bold">1</tspan></text>
      <text x="0" y="282" fill="#cdd6f4">Enter the first number:  <tspan fill="#fab387" font-weight="bold">15.5</tspan></text>
      <text x="0" y="304" fill="#cdd6f4">Enter the second number: <tspan fill="#fab387" font-weight="bold">26.5</tspan></text>

      <!-- Result -->
      <text x="0" y="336" fill="#a6e3a1" font-weight="bold">&gt;&gt;&gt; Result: 15.5 + 26.5 = 42</text>

      <!-- Repeat Prompt -->
      <text x="0" y="370" fill="#cdd6f4">Would you like to perform another calculation? (y/n): <tspan fill="#a6e3a1" font-weight="bold">n</tspan></text>

      <!-- Exit Banner -->
      <text x="0" y="405" fill="#cdd6f4">========================================================</text>
      <text x="0" y="425" fill="#fab387">  Thank you for using Basic Calculator! Have a great day!</text>
      <text x="0" y="445" fill="#cdd6f4">========================================================</text>
      <text x="0" y="475" fill="#89b4fa" font-weight="bold">$ <tspan fill="#f5e0dc" class="cursor">█</tspan></text>
    </g>
  </g>
</svg>
